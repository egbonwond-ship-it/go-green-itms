name: Health check and keep-alive

# Calls the public health endpoint every day. This keeps the free Supabase
# database from pausing after 7 days without use, and the run fails (GitHub
# emails the repo owner) if the site or the database is down.
on:
  schedule:
    - cron: '0 6 * * *' # 07:00 Lagos time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check https://support.go-greentechnologies.com/api/health
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 30 https://support.go-greentechnologies.com/api/health) && { echo "$body"; exit 0; }
            echo "Attempt $i failed, retrying in 30s"; sleep 30
          done
          echo "Service desk health check failed"; exit 1
